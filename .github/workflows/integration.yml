name: Integration

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "broker/**"
      - "runner/**"
      - "nginx/**"
      - "front/**"
      - "integration/**"
      - "compose.yml"
      - "init/**"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

jobs:
  integration-go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pattern: amd64
            image_platform: linux/amd64
          - pattern: arm64
            image_platform: linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_PLATFORM: ${{ matrix.image_platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build integration images
        run: docker compose --env-file .env.example --profile integration build nginx broker runner-1 forward-cert front
      - name: Verify front boots
        # `--no-deps`を付けないとnginx / forward-certも起動し、
        # 続くintegration-testの起動時にforward-certが再走して
        # certが入れ替わり、既に読み込み済みのnginxが新certをverifyできず502になる。
        run: docker compose --env-file .env.example --profile integration up --wait --no-deps front
      - name: Run integration tests
        run: docker compose --env-file .env.example --profile integration run --rm integration-test
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.example --profile integration down -v
